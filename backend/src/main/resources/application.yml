spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/chinese_learning?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 10s
server:
  port: ${SERVER_PORT:8088}
  servlet:
    encoding:
      force: true
      charset: UTF-8
      enabled: true
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  configuration:
    map-underscore-to-camel-case: true
tencent:
  soe:
    appid: ${TENCENT_SOE_APPID:}
    secretId: ${TENCENT_SOE_SECRET_ID:}
    secretKey: ${TENCENT_SOE_SECRET_KEY:}
  tts:
    # 数字人发声：使用腾讯云 API 密钥（默认复用语音评测的同一组密钥）
    secretId: ${TENCENT_TTS_SECRET_ID:${TENCENT_SOE_SECRET_ID:}}
    secretKey: ${TENCENT_TTS_SECRET_KEY:${TENCENT_SOE_SECRET_KEY:}}
    voiceType: ${TENCENT_TTS_VOICE_TYPE:101001}
interaction:
  tts:
    # tencent：服务器使用；local：仅 macOS 本机预览（/usr/bin/say）
    provider: ${INTERACTION_TTS_PROVIDER:tencent}
  agent:
    model: ${INTERACTION_AGENT_MODEL:}
fastgpt:
  api:
    key: ${FASTGPT_API_KEY:}
    url: ${FASTGPT_API_URL:https://api.fastgpt.in/api/v1/chat/completions}
audio:
  storage-dir: ${AUDIO_STORAGE_DIR:./data/audios}
  public-base-url: ${AUDIO_PUBLIC_BASE_URL:/audios}
