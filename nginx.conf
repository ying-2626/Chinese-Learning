# 前后端分离项目Nginx配置示例
server {
    server_name shengdonghanyu.com www.shengdonghanyu.com;

    root /usr/share/nginx/html;
    index index.html index.htm index.php;
    # 与后端 multipart 上限一致；nginx 默认 1m 会拒绝较长的录音上传（413）
    client_max_body_size 20m;
    # 压缩脚本、样式、JSON 与 Live2D 模型（.moc3 以 octet-stream 返回，约可减半）
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream;

    # 博信息别单博信息/API 姓吏日期吏日期
    location ~ ^/(api|scoreAction|user|chat)/ {
        proxy_pass http://localhost:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 音频文件访问
    location /audios/ {
        proxy_pass http://localhost:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/shengdonghanyu.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/shengdonghanyu.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP重定向到HTTPS
server {
    if ($host = www.shengdonghanyu.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = shengdonghanyu.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name shengdonghanyu.com www.shengdonghanyu.com;
    return 404;
}

# 备案完成前用服务器 IP 访问（HTTP）。HTTP 不是安全连接，浏览器会禁用麦克风，语音测评无法录音；
# 数字人画面、文字互动与播报不受影响。备案完成、改用 HTTPS 域名后可删除此段。
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;
    client_max_body_size 20m;
    # 压缩脚本、样式、JSON 与 Live2D 模型（.moc3 以 octet-stream 返回，约可减半）
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream;

    location ~ ^/(api|scoreAction|user|chat)/ {
        proxy_pass http://localhost:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /audios/ {
        proxy_pass http://localhost:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
