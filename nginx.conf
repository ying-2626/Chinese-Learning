# 声动汉语站点配置（2026-11-04 更新：IP 访问、压缩、缓存、上传上限；证书与录音路径沿用服务器原值）
server {
    server_name shengdonghanyu.com www.shengdonghanyu.com;

    root /usr/share/nginx/html;
    index index.html index.htm;
    # 与后端 multipart 上限一致；nginx 默认 1m 会拒绝较长的录音上传（413）
    client_max_body_size 20m;
    # 压缩脚本、样式、JSON 与 Live2D 模型（.moc3 以 octet-stream 返回）
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream;

    # 后端接口
    location ~ ^/(api|scoreAction|user|chat)/ {
        proxy_pass http://localhost:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 音频文件访问
    location /audios/ {
        alias /www/wwwroot/web/audios/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 页面、脚本、样式与配置每次向服务器确认是否更新（未变时只返回 304）
    location ~* \.(html|js|css|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 图片、视频、字体与人物模型缓存一天
    location ~* \.(png|jpe?g|webp|gif|svg|ico|mp4|woff2?|moc3)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/nginx/ssl/shengdonghanyu.com.pem; # managed by Certbot
    ssl_certificate_key /etc/nginx/ssl/shengdonghanyu.com.key; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP重定向到HTTPS
server {
    if ($host = www.shengdonghanyu.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = shengdonghanyu.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name shengdonghanyu.com www.shengdonghanyu.com;
    return 404;
}

# 备案完成前用服务器 IP 访问（HTTP）。HTTP 下浏览器禁用麦克风，语音测评无法录音；数字人与文字互动不受影响。
# 备案完成、改用 HTTPS 域名后可删除此段。
server {
    listen 80 default_server;
    server_name 121.43.81.138;

    root /usr/share/nginx/html;
    index index.html index.htm;
    client_max_body_size 20m;
    gzip on;
    gzip_min_length 1024;
