<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 · 声动汉语</title>
    <link rel="stylesheet" href="styles/register.css">
    </link>
    <link rel="stylesheet" href="styles/ui-base.css">
    <link rel="stylesheet" href="styles/auth-pricing-refresh.css">
    <link rel="stylesheet" href="styles/ui-motion.css?v=20260927">
    <link rel="stylesheet" href="styles/liquid-glass.css?v=20260927">
</head>

<body class="ui-auth">
    <aside class="auth-art">
        <a class="auth-brand" href="entry.html"><img src="img/side_logo.png" alt="" width="28" height="28">声动汉语</a>
        <div class="auth-art-copy">
            <p class="auth-slogan">让每一次开口，<br>都被精准听见</p>
            <p class="auth-sub">逐字诊断声韵调 · AI 助教纠音 · 数字人陪练</p>
        </div>
    </aside>
    <main class="auth-main">
    <div class="form-container">
        <h1 class="form-title">创建账号</h1>
        <p class="form-sub">注册即可免费体验语音测评与 AI 点评</p>
        <!-- 注册表单 -->
        <form id="LoginForm">
            <span style="font-size:14px;width:80px;text-align:right;line-height: 30px;">用户名</span>
            <br>
            <input type="text" placeholder="" class="username" aria-label="用户名" autocomplete="username" required>
            <br>
            <span style="font-size:14px;width:80px;text-align:right;line-height: 30px;">邮箱</span>
            <br>
            <input type="email" placeholder="" class="email" aria-label="邮箱" autocomplete="email" required>
            <br>
            <span style="font-size:14px;width:80px;text-align:right;line-height: 30px;">密码</span>
            <br>
            <input type="password" placeholder="" class="password" aria-label="密码" autocomplete="new-password" required>
            <br>
            <span style="font-size:14px;width:80px;text-align:right;line-height: 30px;">密码:
                <p class="error" style=" text-align: center;color: red; margin: 0">请再次输入密码以确认</p>
            </span>
            <br>
            <input type="password" placeholder="" class="password1" aria-label="确认密码" autocomplete="new-password" required>
            <br>
            <span style="font-size:14px;width:80px;text-align:right;line-height: 30px;">验证码</span>
            <br>
            <input type="text" placeholder="" class="code" aria-label="验证码" autocomplete="one-time-code" required style="width: 45%; float: left;">
            <br>
            <button type="button" class="GetCode" style="width: 25%; height: 40px; border-radius: 3px; float: right;">获取验证码</button>
            <button type="submit" class="button" id="login">注册</button>
            <p id="authStatus" class="auth-status" role="status" aria-live="polite" hidden></p>
            </form>

        <a href="login.html">已有账户？点击这里登录</a>
    </div>
    </main>
    <script src="js/config/config.js?v=20260927"></script>
    <script src="js/vendor/axios-1.21.0.min.js"></script>
    <script src="js/register.js?v=20260927"></script>
    <script defer src="js/ui-motion.js?v=20261104c"></script>
    <script defer src="js/liquid-glass.js?v=20260927"></script>
</body>

</html>
