<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数字人舞台</title>
  <link rel="stylesheet" href="styles/ui-base.css">
  <script src="js/modules/LegacyContent.js"></script>
  <script src="js/vendor/live2dcubismcore.min.js"></script>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}
    body{background:radial-gradient(120% 90% at 50% 18%,#ffffff 0%,#eef3fb 55%,#e1e9f6 100%);font-family:var(--ui-font);color:var(--ui-ink);overflow:hidden}
    canvas,.stage-background{position:absolute;inset:0;width:100%;height:100%;display:block}
    .stage-background{object-fit:cover}
    .stage-status{position:absolute;left:16px;top:14px;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.78);backdrop-filter:blur(8px);font-size:12px;color:#405779;box-shadow:0 1px 4px rgba(30,50,90,.08)}
    .stage-status i{width:8px;height:8px;border-radius:50%;background:#9aabc6}.stage-status[data-speaking="true"] i{background:#2563eb;box-shadow:0 0 0 4px #dbe7ff}
    .stage-status[data-error="true"] i{background:#d14343}
    #enable{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);padding:10px 22px;border:0;border-radius:999px;background:#2563eb;color:#fff;font:inherit;font-size:13px;cursor:pointer;box-shadow:0 6px 18px rgba(37,99,235,.28)}
    #enable:focus-visible{outline:3px solid #9bb9f3;outline-offset:3px}
    .stage-credit{position:absolute;right:12px;bottom:8px;font-size:10px;color:#8a99b3}
  </style>
</head>
<body>
  <video class="stage-background" src="live2d/backgrounds/cute-city.mp4" autoplay muted loop playsinline aria-hidden="true"></video>
  <canvas id="stage" aria-label="数字人"></canvas>
  <div class="stage-status" id="status-pill" role="status" aria-live="polite"><i aria-hidden="true"></i><span id="status">正在加载人物</span></div>
  <button id="enable" type="button" hidden>点击启用语音</button>
  <p class="stage-credit">Live2D · Shizuku</p>
<script type="module">
  import { installAvatarHost } from './js/interaction/avatar-host.js';
  import { createLocalAudioDriver } from './js/interaction/local-audio.js';
  import { createLive2DStage } from './js/interaction/live2d-stage.js';

  const pill = document.getElementById('status-pill'), status = document.getElementById('status'), button = document.getElementById('enable');
  const labels = {'audio.ready':'可以开口了','speech.pending':'正在准备语音','speech.started':'正在说话','speech.ended':'说完了','speech.cancelled':'已停下','speech.error':'语音不可用'};
  const setStatus = (text, { speaking = false, error = false, detail = '' } = {}) => {
    status.textContent = text; pill.dataset.speaking = String(speaking); pill.dataset.error = String(error); pill.title = detail;
  };
  const audio = createLocalAudioDriver({ getHeaders: () => window.LegacyContent.headers(), onState(type, message) {
    // 画面上只显示简短状态，技术原因放在悬停提示里。
    const text = type === 'speech.error' ? (/启用语音/.test(message) ? '请先点击「点击启用语音」' : '暂时无法发声') : labels[type] || type;
    setStatus(text, { speaking: type === 'speech.started', error: type === 'speech.error', detail: type === 'speech.error' ? message : '' });
    button.hidden = audio.ready;
  } });
  const enable = async () => { const ok = await audio.enable(); button.hidden = ok; return ok; };
  button.addEventListener('click', enable);

  // 浏览器可能要求本画面内的点击才允许出声；未就绪时先尝试解锁，失败再提示点击。
  let waiting = null;
  const driver = {
    provider: 'live2d-local-audio', capabilities: audio.capabilities,
    speak(command, emit) {
      waiting = null;
      if (audio.ready) return audio.speak(command, emit);
      const token = waiting = {};
      enable().then(ok => {
        if (waiting !== token) return;
        waiting = null;
        if (ok) audio.speak(command, emit);
        else { button.hidden = false; emit({ type: 'speech.error', message: '请先点击数字人画面里的“点击启用语音”。' }); }
      });
    },
    interrupt() { waiting = null; audio.interrupt(); },
  };

  // 先装宿主再加载模型：父页面在 iframe load 时握手，人物加载慢不影响播报能力。
  let stage = null;
  const host = installAvatarHost({ allowedOrigin: location.origin, allowedSource: parent, driver });
  window.addEventListener('pagehide', () => { host.dispose(); stage?.dispose(); }, { once: true });
  try {
    stage = await createLive2DStage({ canvas: document.getElementById('stage'), modelUrl: 'live2d/Shizuku/Shizuku.model3.json', framing: { zoom: 1.05, focusY: 0.08 },
      getMouthLevel: () => audio.getLevel() * 7 });
    setStatus('准备就绪');
    button.hidden = audio.ready;
  } catch (error) {
    setStatus('人物加载失败', { error: true, detail: String(error.message || error) });
  }
</script>
</body>
</html>
